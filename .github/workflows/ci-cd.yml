name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # Trigger on version tags
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python dependencies
        run: |
          uv sync --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install

      - name: Install and build Keycloak theme
        working-directory: keycloak
        run: |
          bun install
          bun run build

      - name: Run code quality checks
        run: |
          echo "Running all code quality checks via pre-commit..."
          uv run pre-commit run --all-files

          # Add results to GitHub step summary
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "All pre-commit hooks passed successfully." >> $GITHUB_STEP_SUMMARY

      - name: Run Django template linting
        run: |
          echo "Running Django template linting with djlint..."

          # Run format check
          echo "Checking template formatting..."
          uv run djlint . --extension=j2 --check

          # Run linting
          echo "Running template linting..."
          uv run djlint . --extension=j2 --lint

          # Add results to GitHub step summary
          echo "## Django Template Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "Django template linting and format checking completed successfully." >> $GITHUB_STEP_SUMMARY

      - name: Validate Caddyfile
        run: |
          echo "Validating Caddyfile configuration..."

          # Validate Caddyfile syntax
          docker run --rm -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile caddy:latest caddy validate --config /etc/caddy/Caddyfile

          # Check Caddyfile formatting
          docker run --rm -v ${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile caddy:latest caddy fmt /etc/caddy/Caddyfile > /tmp/formatted_caddyfile

          # Compare formatted output with original
          if ! diff -q ${{ github.workspace }}/Caddyfile /tmp/formatted_caddyfile > /dev/null 2>&1; then
            echo "Caddyfile is not properly formatted. Run 'caddy fmt --overwrite' to fix." >&2
            echo "Differences:" >&2
            diff ${{ github.workspace }}/Caddyfile /tmp/formatted_caddyfile >&2
            exit 1
          fi

          # Add results to GitHub step summary
          echo "## Caddyfile Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "Caddyfile syntax is valid and properly formatted." >> $GITHUB_STEP_SUMMARY

      - name: Check migrations are consistent with models
        env:
          DJANGO_SETTINGS_MODULE: sbomify.test_settings
        run: |
          echo "Checking migrations are in sync with models..."
          # `makemigrations --check --dry-run` exits non-zero if a Django model
          # was changed without a corresponding migration. Catches the
          # "forgot to run makemigrations" class of bug before merge.
          uv run python manage.py makemigrations --check --dry-run --no-input

          echo "## Migration Consistency" >> $GITHUB_STEP_SUMMARY
          echo "All models are in sync with migrations." >> $GITHUB_STEP_SUMMARY

  # Everything except the Playwright suite, in one job parallelised with
  # pytest-xdist. The previous 16-way matrix executed 685 s of tests inside
  # 2371 s of job time: each shard rebuilt the test image, booted a Chromium it
  # never used, and ran pytest three times. Collapsing to one job pays that
  # setup once instead of sixteen times, which is where the saving is.
  #
  # It stays inside the compose container rather than running on the host.
  # Running it on the runner directly is ~35 s faster, but WeasyPrint binds
  # native libraries at import and the runner's are not the image's: on the
  # host, test_pdf_service silently stopped embedding the signature PNG. The
  # image is the environment production uses, and for one job the rebuild is
  # not worth drifting from it.
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: sbomify.test_settings
      DEBUG: True
      STRIPE_SECRET_KEY: 'sk_test_dummy_key_for_ci'
      STRIPE_WEBHOOK_SECRET: 'whsec_dummy_key_for_ci'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install

      # django-vite reads sbomify/static/dist/manifest.json at template render
      # time, so the assets have to exist before any view test runs.
      - name: Build JS assets
        run: bun run build

      - name: Start Docker Compose for tests
        run: |
          docker compose -f docker-compose.tests.yml up -d

      # `shell: bash` plus pipefail: the default shell is `bash -e` without
      # pipefail, so `pytest | tee` would report tee's status and a failing
      # suite would pass silently (same trap as the Frontend Tests job).
      #
      # One invocation, not three. The old job counted tests with a throwaway
      # --collect-only pass and then split the run on the `anyio` marker; only
      # 8 tests in the repo carry it, so fifteen of the sixteen shards booted
      # Django a third time to run nothing. Nor is pytest's exit code 5
      # ("collected nothing") mapped to success any more — that is a real
      # failure now that the paths are not an allowlist.
      #
      # `--dist loadscope` keeps a class/module on one worker, so fixtures with
      # class or module scope are built once rather than once per worker.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          docker compose -f docker-compose.tests.yml exec -T tests sh -c "
            uv run pytest --tb=short \
              -n auto --dist loadscope \
              --ignore=sbomify/apps/core/tests/e2e \
              sbomify
          " | tee test_results.txt

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test Results"
            echo
            grep -E "(failed|passed|error)" test_results.txt | tail -1 || echo "Test run completed"
          } >> $GITHUB_STEP_SUMMARY
          if grep -q "^FAILED\|^ERROR" test_results.txt; then
            {
              echo
              echo "### Failed Tests:"
              grep "^FAILED\|^ERROR" test_results.txt
            } >> $GITHUB_STEP_SUMMARY
          fi

  # The Playwright suite is the pipeline's critical path: 618 browser tests at
  # ~2.8 s each is ~29 minutes if run in one job. Split it six ways with
  # pytest-split, weighted by `.github/e2e-test-durations.json` so the groups
  # come out even (~290 s each) rather than merely equal in test count.
  #
  # Each shard runs its own serial pytest. xdist is deliberately NOT used here:
  # a handful of snapshot assertions are sensitive to CPU contention and start
  # diffing when workers compete for the runner, whereas a shard gets a whole
  # runner to itself and behaves exactly as the single job did.
  #
  # Refresh the durations file after a material change to the suite:
  #   pytest sbomify/apps/core/tests/e2e --store-durations \
  #     --durations-path .github/e2e-test-durations.json
  # Tests missing from the file fall back to the average, so a new test is
  # scheduled sanely without one — it only drifts the balance, never drops.
  e2e-tests:
    name: E2E Tests (${{ matrix.group }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    env:
      DJANGO_SETTINGS_MODULE: sbomify.test_settings
      DEBUG: True
      STRIPE_SECRET_KEY: 'sk_test_dummy_key_for_ci'
      STRIPE_WEBHOOK_SECRET: 'whsec_dummy_key_for_ci'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install

      - name: Build JS assets
        run: bun run build

      - name: Start Docker Compose for tests
        run: |
          docker compose -f docker-compose.tests.yml up -d

      - name: Run E2E Tests (group ${{ matrix.group }}/6)
        shell: bash
        run: |
          set -o pipefail
          docker compose -f docker-compose.tests.yml exec -T tests sh -c "
            uv run pytest --tb=short -v \
              --splits 6 --group ${{ matrix.group }} \
              --durations-path .github/e2e-test-durations.json \
              sbomify/apps/core/tests/e2e/
          " | tee test_results.txt

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E2E Test Results (group ${{ matrix.group }}/6)"
            echo
            grep -E "(failed|passed|error)" test_results.txt | tail -1 || echo "Test run completed"
          } >> $GITHUB_STEP_SUMMARY
          if grep -q "^FAILED\|^ERROR" test_results.txt; then
            {
              echo
              echo "### Failed Tests:"
              grep "^FAILED\|^ERROR" test_results.txt
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Take ownership of E2E diffs
        if: failure()
        run: sudo chown -R $USER:$USER sbomify/apps/*/tests/e2e/__diffs__ 2>/dev/null || true

      - name: Upload E2E Test Diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-diffs-group-${{ matrix.group }}
          path: 'sbomify/apps/*/tests/e2e/__diffs__/*.jpg'
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install JS dependencies
        run: bun install

      - name: Install and build Keycloak theme
        working-directory: keycloak
        run: |
          bun install
          bun run build

      - name: Run Frontend Tests
        # `shell: bash` is required: the default shell is `bash -e` without
        # pipefail, so `bun test | tee` would report tee's exit status and a
        # failing test suite would pass silently.
        shell: bash
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          bun test | tee -a $GITHUB_STEP_SUMMARY

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    outputs:
      github-image: ${{ steps.meta.outputs.github_image_id }}
      docker-hub-image: ${{ steps.meta.outputs.docker_hub_image_id }}
      image-digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      IMAGE_NAME: sbomify
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # The Dockerfile ends in `COPY . .`, so .dockerignore is the only thing
      # keeping the chart and the docs out of the image. Probe the real context
      # rather than grepping .dockerignore, so the check reflects what Docker
      # actually copies. busybox is pinned: a floating tag would let the probe
      # change under CI without a commit.
      - name: Build context excludes non-application files
        run: |
          set -e
          printf 'FROM busybox:1.37.0\nCOPY . /code\n' > /tmp/probe.Dockerfile
          docker build -q -f /tmp/probe.Dockerfile -t probe:ci . >/dev/null
          docker run --rm probe:ci ls -1A /code > context.txt
          grep -qx sbomify context.txt || { echo "::error::probe is broken, the app is missing"; exit 1; }
          ! grep -qxE 'charts|deploy|\.github|docs' context.txt ||
            { echo "::error::deployment files are in the build context, add them to .dockerignore"; exit 1; }

      - name: Log in to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: sbomifyhub
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          GITHUB_IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          GITHUB_IMAGE_ID=$(echo $GITHUB_IMAGE_ID | tr '[A-Z]' '[a-z]')
          DOCKER_HUB_IMAGE_ID=docker.io/sbomifyhub/${{ env.IMAGE_NAME }}

          # For pull requests, just set dummy tags (won't be pushed anyway)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAGS="$GITHUB_IMAGE_ID:pr-${{ github.event.number }}"
          # Determine tags based on trigger for pushes/releases
          elif [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            # For git tags, use the version number (keep 'v' prefix)
            VERSION=$(echo "${{ github.ref }}" | sed -e 's,refs/tags/,,')
            TAGS="$GITHUB_IMAGE_ID:$VERSION,$DOCKER_HUB_IMAGE_ID:$VERSION"
          else
            # For master branch pushes, use latest
            TAGS="$GITHUB_IMAGE_ID:latest,$DOCKER_HUB_IMAGE_ID:latest"
          fi

          echo "github_image_id=$GITHUB_IMAGE_ID" >> $GITHUB_OUTPUT
          echo "docker_hub_image_id=$DOCKER_HUB_IMAGE_ID" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Extract build metadata for OCI labels
        id: build_meta
        run: |
          # Git commit SHA (full and short)
          GIT_COMMIT="${{ github.sha }}"
          GIT_COMMIT_SHORT=$(echo "$GIT_COMMIT" | cut -c1-7)

          # Build timestamp in RFC 3339 format
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Determine version and ref type
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed -e 's,refs/tags/,,')
            GIT_REF="${VERSION}"
            BUILD_TYPE="release"
          elif [[ "${{ github.ref }}" == "refs/heads/"* ]]; then
            BRANCH=$(echo "${{ github.ref }}" | sed -e 's,refs/heads/,,')
            VERSION="${BRANCH}-${GIT_COMMIT_SHORT}"
            GIT_REF="${BRANCH}"
            BUILD_TYPE="branch"
          else
            VERSION="${GIT_COMMIT_SHORT}"
            GIT_REF="${{ github.ref }}"
            BUILD_TYPE="other"
          fi

          echo "git_commit=$GIT_COMMIT" >> $GITHUB_OUTPUT
          echo "git_commit_short=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_ref=$GIT_REF" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

      - name: Build and push to registries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            GIT_COMMIT=${{ steps.build_meta.outputs.git_commit }}
            GIT_COMMIT_SHORT=${{ steps.build_meta.outputs.git_commit_short }}
            GIT_REF=${{ steps.build_meta.outputs.git_ref }}
            VERSION=${{ steps.build_meta.outputs.version }}
            BUILD_TYPE=${{ steps.build_meta.outputs.build_type }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_meta.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.build_meta.outputs.git_commit }}
            org.opencontainers.image.version=${{ steps.build_meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=sbomify
            org.opencontainers.image.description=Your Security Artifact Hub - Generate, manage, and share SBOMs and compliance documents
            org.opencontainers.image.licenses=Apache-2.0 WITH Commons-Clause-1.0
            org.opencontainers.image.vendor=sbomify
            org.opencontainers.image.ref.name=${{ steps.build_meta.outputs.git_ref }}
            com.sbomify.build.type=${{ steps.build_meta.outputs.build_type }}

      - name: Attest GitHub Container Registry image
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.github_image_id }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.docker_hub_image_id }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Add build summary for non-pushes
        if: ${{ !(github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "## Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker image built successfully but not pushed to registries." >> $GITHUB_STEP_SUMMARY
          echo "Images are only pushed on master branch or version tags." >> $GITHUB_STEP_SUMMARY

      - name: Add deployment summary
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Images:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All images have been attested with GitHub build provenance for supply chain security." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Generate Source SBOMs (Staging) - master branch only
  # =========================================================================
  generate-source-sboms-staging:
    name: Generate SBOMs (${{ matrix.component }}-${{ matrix.format }}-staging)
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            format: cyclonedx
            component_id: 'FoKftlVn4uyq'
            component_name: 'Python Stack'
            lock_file: 'uv.lock'
            output_file: 'backend.cdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
          - component: backend
            format: spdx
            component_id: 'FoKftlVn4uyq'
            component_name: 'Python Stack'
            lock_file: 'uv.lock'
            output_file: 'backend.spdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
          - component: frontend
            format: cyclonedx
            component_id: 'Kpj3ZylyBDkb'
            component_name: 'Frontend Stack'
            lock_file: 'bun.lock'
            output_file: 'frontend.cdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
          - component: frontend
            format: spdx
            component_id: 'Kpj3ZylyBDkb'
            component_name: 'Frontend Stack'
            lock_file: 'bun.lock'
            output_file: 'frontend.spdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        uses: ./.github/actions/determine-version

      - name: Generate and Upload SBOM
        uses: sbomify/sbomify-action@master # scorecard-ignore:pinned-dependencies -- self-dogfooding
        env:
          API_BASE_URL: 'https://stage.sbomify.com'
          COMPONENT_ID: ${{ matrix.component_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.version.outputs.version }}
          LOCK_FILE: ${{ matrix.lock_file }}
          PRODUCT_RELEASE: ${{ matrix.has_product_release && format('["{0}:{1}"]', matrix.product_release_id, steps.version.outputs.version) || '' }}
          SBOM_FORMAT: ${{ matrix.format }}
          AUGMENT: true
          ENRICH: true
          UPLOAD: true
          OUTPUT_FILE: ${{ matrix.output_file }}

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ github.workspace }}/${{ matrix.output_file }}'


  # =========================================================================
  # Generate Container SBOMs (Staging) - master branch only
  # =========================================================================
  generate-container-sboms-staging:
    name: Generate SBOMs (container-${{ matrix.format }}-staging)
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: cyclonedx
            component_id: 'odzUCI8r2any'
            component_name: 'Container'
            output_file: 'container.cdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
          - format: spdx
            component_id: 'odzUCI8r2any'
            component_name: 'Container'
            output_file: 'container.spdx.json'
            product_release_id: 'xJ6NJlgTK37Y'
            has_product_release: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate additional packages from Dockerfile
        run: ./bin/generate_additional_packages.sh > dockerfile_packages.txt

      - name: Determine version
        id: version
        uses: ./.github/actions/determine-version

      - name: Generate and Upload SBOM
        uses: sbomify/sbomify-action@master # scorecard-ignore:pinned-dependencies -- self-dogfooding
        env:
