{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbomify.fullname" . }}-worker
  labels:
    {{- include "sbomify.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sbomify.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "sbomify.configChecksums" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sbomify.componentLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sbomify.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Dramatiq stops consuming on SIGTERM and drains in-flight messages. Give
      # it room: a vulnerability scan or SBOM parse can run for minutes, and
      # killing it early means the task is re-delivered and redone.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      initContainers:
        {{- include "sbomify.waitForDepsInitContainer" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "sbomify.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - manage.py
            - rundramatiq
            - -p
            - {{ .Values.worker.processes | quote }}
            - -t
            - {{ .Values.worker.threads | quote }}
          envFrom:
            {{- include "sbomify.envFrom" (dict "ctx" .) | nindent 12 }}
          env:
            {{- include "sbomify.env" (dict "ctx" .) | nindent 12 }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # No HTTP surface to probe. A liveness probe on process existence adds
          # nothing here: if the dramatiq process dies the container exits and
          # the kubelet restarts it via restartPolicy.
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "sbomify.scratchVolumeMounts" . | nindent 12 }}
            {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "sbomify.scratchVolumes" . | nindent 8 }}
        {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "sbomify.topologySpread" (dict "ctx" $ "component" "worker" "constraints" .) | nindent 8 }}
      {{- end }}
{{- end }}
