{{- range $component, $cfg := dict "web" .Values.web "worker" .Values.worker }}
{{- if and $cfg.podDisruptionBudget.enabled (or (eq $component "web") $cfg.enabled) }}
{{- $replicas := ternary $cfg.autoscaling.minReplicas $cfg.replicaCount $cfg.autoscaling.enabled }}
{{- if gt (int $replicas) 1 }}
---
# Keeps a voluntary disruption (node drain, cluster upgrade) from taking the
# whole tier down at once. Only rendered when there is more than one replica,
# a PDB over a single replica would block drains indefinitely.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s" (include "sbomify.fullname" $) $component }}
  labels:
    {{- include "sbomify.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  # Without this, a PDB also blocks eviction of pods that are already unhealthy,
  # so a tier that is down stays undrainable and wedges node maintenance. The
  # opposite of what a disruption budget is for. AlwaysAllow lets the cluster
  # evict a pod that was never Ready in the first place.
  unhealthyPodEvictionPolicy: {{ $cfg.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  {{- if $cfg.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ $cfg.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sbomify.componentSelectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
