{{/*
The data block is a named template because the pre-install migrations hook
needs its own short-lived copy of it — see job-migrations-hookenv.yaml.

SECRET_KEY and SIGNED_URL_SALT are required rather than generated. Generating
them looked convenient but was wrong three ways: this template is rendered more
than once per release, and `randAlphaNum` runs afresh each time, so the Secret,
the hook copy and the checksum annotation all disagreed; `helm template` was
non-deterministic, making diffs unreadable; and a value only Helm knows is one
`helm uninstall` away from logging out every user and invalidating every signed
URL. They are credentials — they belong in your secret manager alongside the
database password.
*/}}
{{- define "sbomify.secretData" -}}
SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
SIGNED_URL_SALT: {{ .Values.secrets.signedUrlSalt | quote }}
DATABASE_URL: {{ include "sbomify.databaseUrl" . | quote }}
REDIS_URL: {{ include "sbomify.redisUrl" . | quote }}
KEYCLOAK_CLIENT_SECRET: {{ .Values.auth.keycloak.clientSecret | quote }}
{{- if not .Values.objectStorage.useWorkloadIdentity }}
AWS_MEDIA_ACCESS_KEY_ID: {{ .Values.objectStorage.media.accessKeyId | quote }}
AWS_MEDIA_SECRET_ACCESS_KEY: {{ .Values.objectStorage.media.secretAccessKey | quote }}
AWS_SBOMS_ACCESS_KEY_ID: {{ .Values.objectStorage.sboms.accessKeyId | quote }}
AWS_SBOMS_SECRET_ACCESS_KEY: {{ .Values.objectStorage.sboms.secretAccessKey | quote }}
{{- end }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbomify.secretName" . }}
  labels:
    {{- include "sbomify.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "sbomify.secretData" . | nindent 2 }}
{{- end }}
