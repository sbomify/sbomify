---
# Backing services for the LOCAL kind cluster only.
#
# These are deliberately NOT part of the Helm chart. Stateful services have
# their own operational lifecycle — backups, failover, version upgrades — that
# should not be coupled to an application release. The chart therefore requires
# you to point it at PostgreSQL, Redis, object storage and Keycloak that you
# provide; this file is simply what "you provide" means on a laptop.
#
# Single replica, no backups, no TLS, published credentials. For production:
#
#   PostgreSQL  a managed service, or the CloudNativePG operator
#   Redis       a managed service, or an operator
#   Storage     S3 / Cloudflare R2 / Tigris, or a MinIO you operate
#   Keycloak    the Keycloak Operator — the project's official Kubernetes path
#               (Keycloak deliberately publishes no official Helm chart)
#
# Applied by bin/kind-up.sh before the chart is installed.

apiVersion: v1
kind: Service
metadata:
  name: sbomify-dev-postgresql
  labels:
    app.kubernetes.io/name: sbomify-dev-postgresql
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    app.kubernetes.io/name: sbomify-dev-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sbomify-dev-postgresql
  labels:
    app.kubernetes.io/name: sbomify-dev-postgresql
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  serviceName: sbomify-dev-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sbomify-dev-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbomify-dev-postgresql
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - {name: POSTGRES_USER, value: sbomify}
            - {name: POSTGRES_PASSWORD, value: sbomify}
            - {name: POSTGRES_DB, value: sbomify}
            # The mount root is not empty, so initdb gets its own subdirectory.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "sbomify"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "sbomify"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: sbomify-dev-redis
  labels:
    app.kubernetes.io/name: sbomify-dev-redis
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: sbomify-dev-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sbomify-dev-redis
  labels:
    app.kubernetes.io/name: sbomify-dev-redis
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  serviceName: sbomify-dev-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sbomify-dev-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbomify-dev-redis
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: sbomify-dev-minio
  labels:
    app.kubernetes.io/name: sbomify-dev-minio
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
  selector:
    app.kubernetes.io/name: sbomify-dev-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sbomify-dev-minio
  labels:
    app.kubernetes.io/name: sbomify-dev-minio
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  serviceName: sbomify-dev-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sbomify-dev-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbomify-dev-minio
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # Pinned to a release rather than `latest`, which floats across major
          # versions and can change local and CI behaviour without a commit.
          # postgres and redis above track a major line (17, 8), which moves
          # only within a compatible series; MinIO publishes no such tag.
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
---
# Creates the two buckets the app expects. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: sbomify-dev-minio-buckets
  labels:
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - {name: MC_CONFIG_DIR, value: /tmp/.mc}
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set dev http://sbomify-dev-minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing dev/sbomify-media
              mc mb --ignore-existing dev/sbomify-sboms
              # Media is served straight from the bucket URL; SBOMs stay
              # private and are handed out via signed URLs.
              mc anonymous set public dev/sbomify-media
              mc anonymous set none dev/sbomify-sboms
              echo "buckets ready"
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: sbomify-dev-keycloak
  labels:
    app.kubernetes.io/name: sbomify-dev-keycloak
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9000, targetPort: management}
  selector:
    app.kubernetes.io/name: sbomify-dev-keycloak
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sbomify-dev-keycloak
  labels:
    app.kubernetes.io/name: sbomify-dev-keycloak
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  serviceName: sbomify-dev-keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sbomify-dev-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbomify-dev-keycloak
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # start-dev uses the embedded H2 database. Production should use the
          # Keycloak Operator with a real database.
          args: ["start-dev"]
          env:
            # Browser-facing issuer, routed through the Caddy edge.
            - {name: KC_HOSTNAME, value: "http://keycloak.localtest.me/"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_HOSTNAME_STRICT_BACKCHANNEL, value: "false"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: "xforwarded"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
# Provisions the sbomify realm, the OIDC client and two dev users. Idempotent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbomify-dev-keycloak-bootstrap
  labels:
    app.kubernetes.io/part-of: sbomify-dev-dependencies
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e
    KCADM=/opt/keycloak/bin/kcadm.sh
    REALM=sbomify
    CLIENT=sbomify
    SECRET=dev-client-secret
    APP_BASE_URL=https://sbomify.localtest.me

    until $KCADM config credentials --server http://sbomify-dev-keycloak:8080/ \
      --realm master --user admin --password admin; do
      echo "waiting for keycloak admin api..."; sleep 3
    done

    $KCADM get "realms/$REALM" >/dev/null 2>&1 || \
      $KCADM create realms -s "realm=$REALM" -s enabled=true
    $KCADM update "realms/$REALM" -s sslRequired=NONE -s registrationAllowed=true

    if $KCADM get clients -r "$REALM" -q "clientId=$CLIENT" | grep -q '"id"'; then
      UUID=$($KCADM get clients -r "$REALM" -q "clientId=$CLIENT" --fields id --format csv | tail -n1 | tr -d '"')
      $KCADM update "clients/$UUID" -r "$REALM" -s "secret=$SECRET" \
        -s 'redirectUris=["*"]' -s 'webOrigins=["*"]' \
        -s "baseUrl=$APP_BASE_URL" -s "rootUrl=$APP_BASE_URL"
    else
      $KCADM create clients -r "$REALM" -s "clientId=$CLIENT" -s enabled=true \
        -s protocol=openid-connect -s publicClient=false \
        -s 'redirectUris=["*"]' -s 'webOrigins=["*"]' \
        -s standardFlowEnabled=true -s directAccessGrantsEnabled=true \
        -s serviceAccountsEnabled=true \
        -s "baseUrl=$APP_BASE_URL" -s "rootUrl=$APP_BASE_URL" -s "secret=$SECRET"
    fi

    for u in "jdoe:John:Doe" "ssmith:Steve:Smith"; do
      USERNAME=$(echo "$u" | cut -d: -f1)
      FIRST=$(echo "$u" | cut -d: -f2)
      LAST=$(echo "$u" | cut -d: -f3)
      $KCADM get users -r "$REALM" -q "username=$USERNAME" | grep -q '"id"' || \
        $KCADM create users -r "$REALM" -s "username=$USERNAME" \
          -s "firstName=$FIRST" -s "lastName=$LAST" \
          -s "email=$USERNAME@example.com" -s enabled=true -s emailVerified=true
      $KCADM set-password -r "$REALM" --username "$USERNAME" --new-password foobar123
    done
    echo "keycloak ready: jdoe / foobar123, ssmith / foobar123"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sbomify-dev-keycloak-bootstrap
  labels:
    app.kubernetes.io/part-of: sbomify-dev-dependencies
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sbomify-dev-dependencies
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.4.7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "/scripts/bootstrap.sh"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap:
            name: sbomify-dev-keycloak-bootstrap
