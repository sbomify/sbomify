---
# Development-specific environment variable anchors
x-keycloak-env: &keycloak-env
  KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://keycloak:8080/}
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080/}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sbomify}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-sbomify}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-client-secret}

x-keycloak-admin-env: &keycloak-admin-env
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}

x-dev-env: &dev-env
  BUILD_ENV: ${BUILD_ENV:-development}
  DEBUG: ${DEBUG:-True}
  LOCAL_DEV: ${LOCAL_DEV:-True}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  USE_VITE_DEV_SERVER: ${USE_VITE_DEV_SERVER:-True}
  VITE_DEV_SERVER_PORT: ${VITE_DEV_SERVER_PORT:-5170}

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.7}
    restart: ${KEYCLOAK_RESTART_POLICY:-always}
    environment:
      <<: [*keycloak-env, *keycloak-admin-env]
      KC_HOSTNAME_STRICT_BACKCHANNEL: ${KC_HOSTNAME_STRICT_BACKCHANNEL:-true}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes:ro
    command: start-dev

  keycloak-bootstrap:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.7}
    depends_on:
      - keycloak
    volumes:
      - ./bin/keycloak-bootstrap.sh:/keycloak-bootstrap.sh
    entrypoint: /bin/sh /keycloak-bootstrap.sh
    environment:
      <<: [*keycloak-env, *keycloak-admin-env]
      KEYCLOAK_DEV_MODE: ${KEYCLOAK_DEV_MODE:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8000}

  # S3-compatible storage for local development. SeaweedFS `mini` runs the whole
  # stack in one process and creates the buckets from S3_BUCKET on boot, so no
  # bootstrap sidecar is needed. Credentials live in bin/seaweedfs-s3.json and
  # must match the AWS_*_ACCESS_KEY_ID / AWS_*_SECRET_ACCESS_KEY defaults.
  sbomify-s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.42}
    restart: always
    networks:
      default:
        # Legacy alias so existing .env files pointing at the old host still resolve.
        aliases:
          - sbomify-minio
    ports:
      - "${S3_API_PORT:-9000}:9000"  # S3 API
      # Admin UI has no login, so it stays on loopback.
      - "127.0.0.1:${S3_ADMIN_PORT:-23646}:23646"
    environment:
      # Repeating a name here is harmless, so the documents bucket can default
      # to the SBOMs bucket exactly as settings.py does.
      S3_BUCKET: ${AWS_MEDIA_STORAGE_BUCKET_NAME:-sbomify-media},${AWS_SBOMS_STORAGE_BUCKET_NAME:-sbomify-sboms},${AWS_DOCUMENTS_STORAGE_BUCKET_NAME:-sbomify-sboms}
      AWS_MEDIA_STORAGE_BUCKET_NAME: ${AWS_MEDIA_STORAGE_BUCKET_NAME:-sbomify-media}
    volumes:
      - ./bin/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - sbomify_s3_data:/data
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.telemetry=false
      - -webdav=false
    # Probes a bucket, not /healthz: the S3 port answers several seconds before
    # the buckets exist, so /healthz alone would report ready too early.
    healthcheck:
      # $$ so the container expands it, not Compose: an empty name here would
      # probe the bucket list, which answers 200 before any bucket exists.
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:9000/$$AWS_MEDIA_STORAGE_BUCKET_NAME?max-keys=0\""]
      interval: 5s
      timeout: 5s
      retries: 12

  sbomify-backend:
    pull_policy: never  # Never pull from registry in dev, use local builds
    build:
      # context is inherited from docker-compose.yml
      target: ${BUILD_TARGET:-python-app-dev}
      args:
        <<: *dev-env
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}  # Use 1 replica by default in dev
    # ports are inherited from docker-compose.yml
    volumes:
      - ./sbomify:/code/sbomify # Mount local code for development
    environment:
      <<: *dev-env
    depends_on:
      sbomify-db:
        condition: service_healthy
      sbomify-migrations:
        condition: service_completed_successfully
      sbomify-frontend:
        condition: service_started

  sbomify-migrations:
    pull_policy: never  # Never pull from registry in dev, use local builds
    build:
      target: ${BUILD_TARGET:-python-app-dev}
      args:
        <<: *dev-env
    volumes:
      - ./sbomify:/code/sbomify # Mount local code for development
    environment:
      <<: *dev-env

  sbomify-worker:
    pull_policy: never  # Never pull from registry in dev, use local builds
    build:
      target: ${BUILD_TARGET:-python-app-dev}
      args:
        <<: *dev-env
    deploy:
      replicas: ${WORKER_REPLICAS:-1}  # Use 1 replica by default in dev
    volumes:
      - ./sbomify:/code/sbomify # Mount local code for development
    environment:
      <<: *dev-env

  sbomify-scheduler:
    pull_policy: never  # Never pull from registry in dev, use local builds
    build:
      target: ${BUILD_TARGET:-python-app-dev}
      args:
        <<: *dev-env
    volumes:
      - ./sbomify:/code/sbomify # Mount local code for development
    environment:
      <<: *dev-env

  # sbomify-frontend is a new service specific to development
  sbomify-frontend:
    pull_policy: never  # Never pull from registry in dev, use local builds
    build:
      context: . # Must be defined as it's a new service
      target: ${FRONTEND_BUILD_TARGET:-frontend-dev-server}
    ports:
      - "${FRONTEND_PORT:-5170}:5170"
    volumes:
      - ./sbomify:/app-frontend/sbomify # Mount to the WORKDIR of frontend-dev-server stage
      - ./vite.config.ts:/app-frontend/vite.config.ts # Hot-apply Vite config tweaks without a rebuild
      - /app-frontend/node_modules # Prevent host node_modules from overwriting container's
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: ${FRONTEND_RESTART_POLICY:-unless-stopped}

  mailpit:
    image: axllent/mailpit:latest
    expose:
      - 1025
      - 8025
    ports:
      - "8025:8025"
    hostname: mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Use Caddyfile.dev for development
  sbomify-caddy:
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro

volumes:
  keycloak_data:
  sbomify_s3_data:
