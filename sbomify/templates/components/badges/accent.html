{% comment %}
The brand gradient badge. It keeps the neutral hairline of the shell, so the
border colour travels with the recipe.
{% endcomment %}
<c-vars size pill class />
<c-badges.badge variant_class="text-white bg-[linear-gradient(135deg,var(--color-primary-dark)_0%,var(--color-accent-pink)_100%)] shadow-[0_2px_4px_color-mix(in_oklab,var(--color-accent-pink)_30%,transparent)] border-[color-mix(in_oklab,var(--color-border)_20%,transparent)]" size="{{ size }}" :pill="pill" class="{{ class }}" :attrs="attrs">{{ slot }}</c-badges.badge>
