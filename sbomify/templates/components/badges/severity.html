{% comment %}
The CVSS severity badge, for server values and Alpine rows alike. Pass level
or bind data-level; both select the same recipes on the shared badge shell.
Unknown levels use the neutral severity tint. pill changes only the corners.
{% endcomment %}
<c-vars level="unknown" pill class />
<c-badges.badge shape="severity" data-level="{{ level }}" variant_class="text-[color:var(--color-text-secondary)] bg-[color-mix(in_oklab,var(--color-text-muted)_12%,transparent)] border-[color-mix(in_oklab,var(--color-text-muted)_20%,transparent)] data-[level=critical]:text-[color:var(--color-severity-critical)] data-[level=critical]:bg-[color-mix(in_oklab,var(--color-severity-critical)_12%,transparent)] data-[level=critical]:border-[color-mix(in_oklab,var(--color-severity-critical)_20%,transparent)] data-[level=high]:text-[color:var(--color-severity-high)] data-[level=high]:bg-[color-mix(in_oklab,var(--color-severity-high)_12%,transparent)] data-[level=high]:border-[color-mix(in_oklab,var(--color-severity-high)_20%,transparent)] data-[level=medium]:text-[color:var(--color-severity-medium)] data-[level=medium]:bg-[color-mix(in_oklab,var(--color-severity-medium)_12%,transparent)] data-[level=medium]:border-[color-mix(in_oklab,var(--color-severity-medium)_20%,transparent)] data-[level=low]:text-[color:var(--color-severity-low)] data-[level=low]:bg-[color-mix(in_oklab,var(--color-severity-low)_12%,transparent)] data-[level=low]:border-[color-mix(in_oklab,var(--color-severity-low)_20%,transparent)]" :pill="pill" class="{{ class }}" :attrs="attrs">{{ slot }}</c-badges.badge>
