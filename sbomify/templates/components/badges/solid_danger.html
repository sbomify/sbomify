{% comment %}
Solid fill is reserved: confirmed-exploitation alarms (KEV, malicious package)
and alert counters. Everything else stays a tint.
{% endcomment %}
<c-vars size pill class />
<c-badges.badge variant_class="text-white bg-danger border-[color-mix(in_oklab,var(--color-danger)_20%,transparent)]" size="{{ size }}" :pill="pill" class="{{ class }}" :attrs="attrs">{{ slot }}</c-badges.badge>
