{% comment %}A quiet utility control for persistent chrome. The shared icon button owns sizing, semantics and focus; this variant removes the lift and coloured hover treatment and keeps a 44px touch target on phones.{% endcomment %}
<c-vars label size="sm" type="button" href disabled class />
<c-buttons.icon variant_class="max-sm:min-w-11 max-sm:min-h-11 text-[color:var(--color-text-muted)] border-transparent hover:bg-background hover:text-text aria-expanded:bg-background aria-expanded:text-text" label="{{ label }}" size="{{ size }}" type="{{ type }}" href="{{ href }}" :disabled="disabled" class="{{ class }}" :attrs="attrs">{{ slot }}</c-buttons.icon>
