{% comment %}
The workspace panel: the card surface, clipped, so nothing a panel draws can
escape its corners. Everything else comes from c-cards.card.
{% endcomment %}
<c-vars title subtitle icon body_class class />
<c-cards.card variant_class="bg-surface border border-solid border-border shadow-[var(--shadow-card)] relative overflow-hidden" title="{{ title }}" subtitle="{{ subtitle }}" icon="{{ icon }}" body_class="{{ body_class }}" class="{{ class }}" :attrs="attrs">
{% if header %}<c-slot name="header">{{ header }}</c-slot>{% endif %}
{% if footer %}<c-slot name="footer">{{ footer }}</c-slot>{% endif %}
{{ slot }}</c-cards.card>
