{% comment %}The app footer shares the content gutter and rail width. Build metadata and help remain available in every environment.{% endcomment %}
<footer class="sticky bottom-0 z-20 lg:pl-[var(--sidebar-width)] border-t border-border bg-surface">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between gap-3 text-xs text-text-muted">
        <div class="flex items-center gap-3">
            <span>© {% now 'Y' %} sbomify</span>
            {% if app_version %}<span title="{{ git_commit|default:'' }}">v{{ app_version }}</span>{% endif %}
        </div>
        <c-buttons.ghost size="sm" href="{% url 'core:support_contact' %}">Contact support</c-buttons.ghost>
    </div>
</footer>
