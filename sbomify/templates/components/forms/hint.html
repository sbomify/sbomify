{% comment %}
compact leaves spacing to a containing field row.
The help line under a control. One sentence, in the muted ink. A field shows
either this or its error, never both, which c-forms.field enforces.
{% endcomment %}
<c-vars compact class />
<p class="block text-xs leading-[1.5] text-text-muted {% if compact %}mt-0{% else %}mt-1.5{% endif %}{% if class %} {{ class }}{% endif %}"
   {{ attrs }}>{{ slot }}
</p>
