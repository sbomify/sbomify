{% comment %}
The rail between two steps. completed fills it with the success gradient; the
plain one stays the border colour.
compact uses a one-pixel rail alongside the small setup dots.
{% endcomment %}
<c-vars completed compact class />
<span class="relative flex-1 {% if compact %}h-px{% else %}h-[3px]{% endif %} rounded-full overflow-hidden {% if completed %}bg-[linear-gradient(90deg,var(--color-success)_0%,var(--color-success-dark)_100%)]{% else %}bg-border{% endif %}{% if class %} {{ class }}{% endif %}"
      {{ attrs }}></span>
