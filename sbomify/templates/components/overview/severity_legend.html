{% comment %}The product exposure bar's three bands are named independently of colour.{% endcomment %}
<div class="flex flex-wrap items-center gap-3 text-xs text-text-muted"
     aria-label="Severity legend">
    <span class="inline-flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-severity-critical" aria-hidden="true"></span>Critical</span>
    <span class="inline-flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-severity-high" aria-hidden="true"></span>High</span>
    <span class="inline-flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-text-muted/60" aria-hidden="true"></span>Other severities</span>
</div>
