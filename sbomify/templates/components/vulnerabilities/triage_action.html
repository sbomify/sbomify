{% comment %}One triage action for component rows, full reports and plugin findings. The host supplies one modal and checks the live publish_vex capability.{% endcomment %}
<c-vars id purl anchor state justification detail aliases accepted_until risk_owner />
<c-buttons.secondary size="sm" @click="$dispatch('open-triage', { id: '{{ id|escapejs }}', purl: '{{ purl|default:''|escapejs }}', anchor: '{{ anchor|default:''|escapejs }}', state: '{{ state|default:''|escapejs }}', justification: '{{ justification|default:''|escapejs }}', detail: '{{ detail|default:''|escapejs }}', aliases: '{{ aliases|default:''|join:','|escapejs }}', accepted_until: '{{ accepted_until|default:''|escapejs }}', risk_owner: '{{ risk_owner|default:''|escapejs }}' })" only>
<i class="fas fa-stethoscope" aria-hidden="true"></i>Triage
</c-buttons.secondary>
