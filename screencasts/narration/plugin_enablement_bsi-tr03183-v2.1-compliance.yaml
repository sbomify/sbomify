# Narration for the plugin_enablement_bsi-tr03183-v2.1-compliance clip.
#
# Every plugin clip defines the same three beat keys; only the copy differs.
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      BSI TR-03183 is the German technical guideline for SBOM quality, and it
      asks for rather more than the NTIA baseline does.

  what_it_does:
    text: >-
      It's the standard the Cyber Resilience Act leans on in practice, so if
      you sell into the European market, this is the bar your SBOMs will
      eventually be measured against. [pause] The plugin checks conformance and
      tells you which requirements a file misses.

  outro:
    text: >-
      Turning it on early is a great deal cheaper than discovering the gap
      halfway through a procurement review.
