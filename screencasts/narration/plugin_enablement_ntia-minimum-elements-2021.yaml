# Narration for screencasts/plugin_enablement.py
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      Here is how to turn on the NTIA Minimum Elements check in sbomify.

  open_plugins:
    text: >-
      Open Plugins from the sidebar. Plugins are grouped into compliance, security
      and attestation.

  about:
    text: >-
      It checks each SBOM for the NTIA minimum elements, such as supplier,
      component name, version and author.

  tick_save:
    text: >-
      Tick the plugin, then save your changes.

  done:
    text: >-
      The NTIA check is on. Every new SBOM upload now gets a compliance result.

  changes_apply:
    text: >-
      Changes apply to new uploads. Results you already have are kept.
