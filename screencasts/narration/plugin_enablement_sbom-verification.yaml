# Narration for the plugin_enablement_sbom-verification clip.
#
# Every plugin clip defines the same three beat keys; only the copy differs.
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      An SBOM is only as trustworthy as your confidence that it came from who
      it claims to.

  what_it_does:
    text: >-
      This plugin verifies signatures and attestations, covering both
      signatures stored in sbomify and Sigstore attestations published straight
      from GitHub. [pause] It confirms the artifact in front of you is the one
      that was actually signed.

  outro:
    text: >-
      That's the difference between a file somebody emailed you and something
      you can put in front of an auditor.
