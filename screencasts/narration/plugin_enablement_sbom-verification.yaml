# Narration for screencasts/plugin_enablement.py
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      Here is how to turn on SBOM Verification in sbomify.

  open_plugins:
    text: >-
      Open Plugins from the sidebar. Plugins are grouped into compliance, security
      and attestation.

  about:
    text: >-
      It confirms an SBOM has not been tampered with. It checks the file digest,
      Sigstore signatures, and attestations published on GitHub.

  tick_save:
    text: >-
      Tick the plugin, then save your changes.

  done:
    text: >-
      SBOM Verification is on. New uploads are now checked for valid signatures
      and attestations.

  changes_apply:
    text: >-
      Changes apply to new uploads. Results you already have are kept.
