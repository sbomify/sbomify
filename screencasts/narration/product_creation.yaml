# Narration for screencasts/product_creation.py
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      Here is how to set up a product in sbomify, with its components, lifecycle
      dates, links and identifiers.

  product_built_components:
    text: >-
      A product is built from components. Each component holds the SBOMs for one
      part of it.

  name_all_component:
    text: >-
      A name is all a component needs. Create a second one the same way.

  open_products_create:
    text: >-
      Now open Products and create the product your customers buy.

  assign_components_make:
    text: >-
      Assign the components that make up the product.

  product_details_holds:
    text: >-
      Product details holds the rest. Lifecycle dates say when it shipped and how
      long you support it.

  links_point_people:
    text: >-
      Links point people to your website, source code and documentation.

  each_link_has:
    text: >-
      Each link has a type, a title and an address. Add as many as you need.

  identifiers_such_cpe:
    text: >-
      Identifiers such as CPE and PURL let scanners and buyers match your product
      to its records.

  product_set_up:
    text: >-
      The product is set up, with its components and the details customers ask
      about.
