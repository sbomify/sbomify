# Narration for screencasts/security_advisories.py
voice: ara
speed: 1.0

beats:
  intro:
    text: >-
      Here is how to publish a security advisory in sbomify, from first report to
      your Trust Center.

  security_advisories_lists:
    text: >-
      Security advisories lists every advisory in the workspace, with its severity
      and status.

  start_title_all:
    text: >-
      Start with a title. That is all a draft needs.

  set_severity_where:
    text: >-
      Set the severity, and where the work stands right now.

  next_pick_what:
    text: >-
      Next, pick what it affects. Open a product to choose specific releases.

  add_cve_cvss:
    text: >-
      Add the CVE, a CVSS score and a short description if you have them.

  advisory_opens_draft:
    text: >-
      The advisory opens as a draft. Only your workspace can see it.

  timeline_records_every:
    text: >-
      The timeline records every change. Post updates as the fix moves along.

  update_lands_timeline:
    text: >-
      The update lands on the timeline, and the status moves to fix in progress.

  when_ready_publish:
    text: >-
      When you are ready, publish it. Choose who can read it, then confirm.

  has_permanent_tracking:
    text: >-
      It now has a permanent tracking ID and appears on your Trust Center.

  customers_see_public:
    text: >-
      Customers see it on your public advisories page, next to every advisory you
      have published.
