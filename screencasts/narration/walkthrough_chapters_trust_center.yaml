# Narration for screencasts/walkthrough_chapters.py
voice: carina
speed: 1.0

beats:
  trust_center_intro:
    text: >-
      When a vulnerability does affect you, publish a security advisory with a
      tracking ID.

  trust_center_turn_trust_center:
    text: >-
      Then turn on the Trust Center, your public security page.

  trust_center_serve_own_domain:
    text: >-
      Serve it from your own domain, like trust.piedpiper.com.

  trust_center_decide_what_goes:
    text: >-
      You decide what goes public, product by product.

  trust_center_what_customers_see:
    text: >-
      This is what customers see: your products, their artifacts, and your
      advisories, always current.
