# Narration for screencasts/walkthrough_chapters.py
voice: carina
speed: 1.0

beats:
  vulnerabilities_intro:
    text: >-
      Every SBOM is scanned. Vulnerabilities ranks what to fix first, across every
      product.

  vulnerabilities_trends_show_exposure:
    text: >-
      Trends show how exposure moves as new advisories land and fixes ship.

  vulnerabilities_component_each_vulnerability:
    text: >-
      On the core library, libwebp is open and critical, with its fix version and
      its triage state.

  # The agent's calls are drawn in a terminal overlay; they hit the real API
  # with a token made with the "For an AI agent" preset.
  vulnerabilities_agent_rules:
    text: >-
      Your AI agent does the legwork. It traces the code and rules libwebp not
      affected.

  vulnerabilities_agent_refused:
    text: >-
      But it cannot apply that ruling itself. sbomify refuses, and the ruling
      goes to a person for review.

  vulnerabilities_review_tab:
    text: >-
      It waits on the Review tab, marked as from an AI agent, with its reasoning
      and what approving it would hide.

  vulnerabilities_person_approves:
    text: >-
      A person reads it and approves. An agent can propose. Only a person decides.

  vulnerabilities_applied_drops_out:
    text: >-
      Approved, libwebp drops out of the open list, and the header counts it as
      suppressed.

  vulnerabilities_nothing_deleted_vulnerability:
    text: >-
      Nothing is deleted. The vulnerability is still there, closed as not
      affected, with the reason attached.
