# Narration for screencasts/walkthrough_chapters.py
voice: carina
speed: 1.0

beats:
  vulnerabilities_intro:
    text: >-
      Every SBOM is scanned. Vulnerabilities ranks what to fix first, across every
      product.

  vulnerabilities_trends_show_exposure:
    text: >-
      Trends show how exposure moves as new advisories land and fixes ship.

  vulnerabilities_component_each_vulnerability:
    text: >-
      On a component, each vulnerability shows the package, the fix version, and
      its triage state.

  vulnerabilities_not_every_vulnerability:
    text: >-
      Not every vulnerability is exploitable. A VEX document says so, in a
      standard format.

  vulnerabilities_sbomify_shows_dry:
    text: >-
      sbomify shows a dry run first: one vulnerability would be suppressed,
      nothing is stored yet.

  vulnerabilities_applied_drops_out:
    text: >-
      Applied, it drops out of the open list, and the header counts it as
      suppressed.

  vulnerabilities_nothing_deleted_vulnerability:
    text: >-
      Nothing is deleted. The vulnerability is still there, with the reason
      attached.
